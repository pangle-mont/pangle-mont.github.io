<!DOCTYPE html>
<html lang="ko">
<head>

<meta name="description" content="고등학교 음악 수업용 조율 시각화 자료. 우쿨렐레·기타·베이스·바이올린 헤드와 줄감개를 직접 돌려보고, 반음계 모드에서는 피아노 건반으로 음을 확인할 수 있습니다.">
<meta name="author" content="">

<meta property="og:description" content="줄감개를 돌리며 조율 원리를 익히는 웹 기반 튜너 시뮬레이터">
<meta property="og:type" content="website">

<style>
  :root{
    --bg:#efe7da;--panel:#fffaf2;--line:#e3d8c4;--ink:#2b2218;--muted:#8a7c66;
    --wood-edge:#4d2e14;--string:#f0ece2;
    --lcd-blue:#16306e;--lcd-blue-fg:#9fd2ff;--lcd-blue-dim:#5f86c9;
    --lcd-grn:#0e5a26;--lcd-grn-fg:#9df7ac;--lcd-grn-dim:#3f9a57;--bad:#ffd24d;
  }
  *{box-sizing:border-box}html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto;padding:20px 16px 48px}
  header h1{font-size:clamp(20px,3.6vw,28px);margin:0 0 4px;letter-spacing:-.02em}
  header p{margin:0;color:var(--muted);font-size:14px}
  .stage{display:grid;grid-template-columns:minmax(280px,1fr) minmax(290px,1fr);gap:18px;margin-top:18px;align-items:start}
  @media(max-width:780px){.stage{grid-template-columns:1fr}}
  .head-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 6px 8px;box-shadow:0 6px 22px rgba(120,90,40,.10)}
  .head-card h2{font-size:12.5px;color:var(--muted);font-weight:600;margin:2px 0 6px;text-align:center}
  svg{display:block;width:100%;height:auto;touch-action:none}
  #lcd{max-width:300px;margin:0 auto 4px}
  #instr{max-height:54vh}
  #piano{max-width:340px;margin:6px auto 0}
  .knob-grp{cursor:grab}.knob-grp:active{cursor:grabbing}
  text{user-select:none}
  #chromBox{padding:14px 14px 0;text-align:center;color:var(--muted);font-size:13px}
  #chromBox b{color:var(--ink)}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 6px 22px rgba(120,90,40,.10)}
  .panel h2{font-size:12.5px;color:var(--muted);font-weight:600;margin:0 0 8px}
  .modes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
  .modes button{border:2px solid var(--line);background:#fff;border-radius:11px;padding:8px 2px;cursor:pointer;text-align:center;transition:border-color .15s,background .15s}
  .modes button .ml{font-size:18px;font-weight:800;display:block;line-height:1}
  .modes button .mn{font-size:9.5px;color:var(--muted);display:block;margin-top:2px}
  .modes button.on{border-color:var(--ink);background:#fbf3e6}
  .gmode{display:flex;gap:8px;margin-bottom:14px}
  .gmode button{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 8px;cursor:pointer;text-align:center;font-size:13px}
  .gmode button .t{font-size:14px;font-weight:800;display:block}
  .gmode button .s{font-size:11px;color:var(--muted)}
  .gmode button.on{border-color:var(--ink);background:#fbf3e6}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
  .chip{flex:1 1 0;min-width:48px;border:2px solid var(--line);border-radius:11px;padding:7px 3px;text-align:center;cursor:pointer;background:#fff}
  .chip.sel{border-color:var(--ink)}.chip.done{border-color:#2fa66a;background:#eef9f1}
  .chip .cn{font-size:10px;color:var(--muted)}
  .chip .cnote{font-size:17px;font-weight:800;line-height:1.1}
  .chip .cstate{font-size:9px;color:var(--muted);margin-top:1px}
  .chip.done .cstate{color:#2fa66a;font-weight:700}
  .pluck-btn{width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:700;background:var(--ink);color:#fff;cursor:pointer}
  .pluck-btn:active{transform:scale(.98)}
  .tune-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .tune-btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 8px;cursor:pointer;text-align:center}
  .tune-btn:active{transform:scale(.97)}.tune-btn:hover{border-color:#9a6634}
  .tune-btn .big{font-size:20px;font-weight:800;line-height:1.05}
  .tune-btn .lab{font-size:11.5px;color:var(--muted);display:block;margin-top:1px}
  .tune-btn .turn{font-size:11.5px;color:#7c4a22;font-weight:700;display:block;margin-top:2px;min-height:14px}
  .hint{font-size:12.5px;color:var(--muted);margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
  .hint b{color:var(--ink)}
  .reset{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
  .reset button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-size:13px;cursor:pointer}
  .reset button:hover{border-color:#9a6634}
  @media (prefers-reduced-motion: reduce){.knob-grp *{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>멀티모드 튜너</h1>
    <p>줄을 튕기고 <b>줄감개를 끌거나 ▲▼</b>로 바늘을 한가운데에 맞춰 보세요.</p>
  </header>
  <div class="stage">
    <div class="head-card">
      <h2 id="headTitle"></h2>
      <svg id="lcd" viewBox="0 0 300 200"></svg>
      <svg id="instr" viewBox="0 0 360 600"></svg>
      <svg id="piano" viewBox="0 0 320 250" style="display:none"></svg>
      <div id="chromBox" style="display:none"></div>
    </div>
    <div class="panel">
      <h2>모드 선택</h2>
      <div class="modes" id="modes">
        <button data-m="C"><span class="ml">C</span><span class="mn">반음계</span></button>
        <button data-m="G"><span class="ml">G</span><span class="mn">기타</span></button>
        <button data-m="B"><span class="ml">B</span><span class="mn">베이스</span></button>
        <button data-m="V"><span class="ml">V</span><span class="mn">바이올린</span></button>
        <button data-m="U" class="on"><span class="ml">U</span><span class="mn">우쿨렐레</span></button>
      </div>
      <div id="gmodeWrap">
        <h2>4번 줄(G)</h2>
        <div class="gmode" id="gmode">
          <button data-g="high" class="on"><span class="t">High-G</span><span class="s">높은 솔 (392Hz)</span></button>
          <button data-g="low"><span class="t">Low-G</span><span class="s">낮은 솔 (196Hz)</span></button>
        </div>
      </div>
      <h2 id="chipsTitle">줄 선택 · 조율 상태</h2>
      <div class="chips" id="chips"></div>
      <button class="pluck-btn" id="pluckBtn">🔊 튕기기</button>
      <div class="tune-row">
        <button class="tune-btn" id="downBtn"><span class="big">▼</span><span class="lab">음 내리기 (풀기)</span><span class="turn" id="downTurn"></span></button>
        <button class="tune-btn" id="upBtn"><span class="big">▲</span><span class="lab">음 올리기 (조이기)</span><span class="turn" id="upTurn"></span></button>
      </div>
      <div class="reset">
        <button id="shuffleBtn">🎲 흐트러뜨려 연습</button>
        <button id="perfectBtn">✅ 한 번에 맞추기</button>
      </div>
      <div class="hint" id="hint"></div>
    </div>
  </div>
</div>

<script>
const F={C4:261.63,E4:329.63,G4:392.00,G3:196.00,A4:440.00,E2:82.41,A2:110.00,D3:146.83,B3:246.94,E1:41.20,A1:55.00,D2:73.42,G2:98.00,D4:293.66,E5:659.25};
const NOTE_NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const circled=['','①','②','③','④','⑤','⑥'];
const NS='http://www.w3.org/2000/svg';
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}

/* ===== 악기 레이아웃 (헤드 좌표) ===== */
const WOOD=`<linearGradient id="wood" x1="0" y1="0" x2="1" y2="0.15"><stop offset="0" stop-color="#7c4a22"/><stop offset=".5" stop-color="#a06c39"/><stop offset="1" stop-color="#6e4020"/></linearGradient>
<linearGradient id="fb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="rgba(0,0,0,.28)"/><stop offset=".5" stop-color="rgba(0,0,0,0)"/><stop offset="1" stop-color="rgba(0,0,0,.28)"/></linearGradient>
<radialGradient id="knobg" cx=".35" cy=".35" r=".8"><stop offset="0" stop-color="#b07b40"/><stop offset="1" stop-color="#5e3717"/></radialGradient>`;

const LAYOUT={
  U:{ name:'우쿨렐레', nutY:388, bottom:560,
    head:'M96 104 Q180 86 264 104 L268 166 Q278 236 262 316 Q250 376 222 388 L138 388 Q110 376 98 316 Q82 236 92 166 Z',
    grain:[180,205,158,228,135], grainY:[106,240,384],
    nut:[128,386,116], fbX:[134,238],
    strings:[
      {id:4,note:'G',post:[120,288],knob:[60,288],nutX:150,upCW:false},
      {id:3,note:'C',post:[120,196],knob:[60,196],nutX:174,upCW:false},
      {id:2,note:'E',post:[240,196],knob:[300,196],nutX:198,upCW:true},
      {id:1,note:'A',post:[240,288],knob:[300,288],nutX:222,upCW:true}],
    mini:'M30 50 L120 50 M118 38 Q175 30 175 62 Q175 86 130 86 L118 86 Q100 86 100 70 L100 50 M150 50 m-2 0 a16 16 0 1 0 32 0 a16 16 0 1 0 -32 0',
    miniDraw:'uke' },

  G:{ name:'기타', nutY:404, bottom:584,
    head:'M116 118 Q124 96 150 96 L210 96 Q236 96 244 118 L250 152 Q254 300 246 366 Q242 396 214 404 L146 404 Q118 396 114 366 Q106 300 110 152 Z',
    grain:[180,205,155,225,138], grainY:[112,254,400],
    nut:[126,402,108], fbX:[132,228],
    strings:[
      {id:6,note:'E',post:[120,314],knob:[58,314],nutX:140,upCW:false},
      {id:5,note:'A',post:[120,232],knob:[58,232],nutX:156,upCW:false},
      {id:4,note:'D',post:[120,150],knob:[58,150],nutX:172,upCW:false},
      {id:3,note:'G',post:[240,150],knob:[302,150],nutX:188,upCW:true},
      {id:2,note:'B',post:[240,232],knob:[302,232],nutX:204,upCW:true},
      {id:1,note:'E',post:[240,314],knob:[302,314],nutX:220,upCW:true}],
    miniDraw:'guitar' },

  B:{ name:'베이스', nutY:414, bottom:588, bassKnob:true,
    head:'M152 122 Q104 110 92 154 Q86 200 96 250 L104 372 Q108 408 142 414 L206 414 Q222 410 222 388 L220 156 Q218 128 188 122 Z',
    grain:[150,178,122,200], grainY:[126,266,410],
    nut:[122,412,102], fbX:[128,222],
    strings:[
      {id:4,note:'E',post:[122,366],knob:[56,366],nutX:152,upCW:false},
      {id:3,note:'A',post:[120,298],knob:[54,298],nutX:170,upCW:false},
      {id:2,note:'D',post:[118,228],knob:[52,228],nutX:188,upCW:false},
      {id:1,note:'G',post:[116,158],knob:[50,158],nutX:206,upCW:false}],
    miniDraw:'bass' },

  V:{ name:'바이올린', nutY:418, bottom:590, scroll:true,
    head:'M140 220 L220 220 L217 410 Q215 420 205 420 L155 420 Q145 420 143 410 Z',
    grain:[180,200,160], grainY:[226,326,414],
    nut:[142,416,76], fbX:[148,212],
    strings:[
      {id:4,note:'G',post:[154,336],knob:[110,336],nutX:154,upCW:false},
      {id:3,note:'D',post:[154,262],knob:[110,262],nutX:172,upCW:false},
      {id:2,note:'A',post:[206,262],knob:[250,262],nutX:190,upCW:true},
      {id:1,note:'E',post:[206,336],knob:[250,336],nutX:208,upCW:true}],
    miniDraw:'violin' }
};
const FREQ_OF={ // 모드별 줄 주파수
  G:{6:F.E2,5:F.A2,4:F.D3,3:F.G3,2:F.B3,1:F.E4},
  B:{4:F.E1,3:F.A1,2:F.D2,1:F.G2},
  V:{4:F.G3,3:F.D4,2:F.A4,1:F.E5}
};

let mode='U', gMode='high', selected=4, state={};
let chrom={freq:F.A4*Math.pow(2,(Math.random()*84-42)/1200), oct:4};
const OK=5,STEP=4.2;

function curStrings(){ return LAYOUT[mode].strings; }
function targetFreq(id){
  if(mode==='U'){ if(id===4) return gMode==='low'?F.G3:F.G4; return id===3?F.C4:id===2?F.E4:F.A4; }
  return FREQ_OF[mode][id];
}
function curFreq(id){ return targetFreq(id)*Math.pow(2,state[id].cents/1200); }
function randCents(){return Math.random()*84-42;}
function initState(){ state={}; curStrings().forEach(s=>state[s.id]={cents:randCents(),pegAngle:0}); selected=curStrings()[0].id; }
function freqToNote(f){const midi=Math.round(69+12*Math.log2(f/440));const ref=440*Math.pow(2,(midi-69)/12);return {pc:((midi%12)+12)%12,name:NOTE_NAMES[((midi%12)+12)%12],oct:Math.floor(midi/12)-1,cents:1200*Math.log2(f/ref)};}

/* ===== LCD ===== */
const lcd=document.getElementById('lcd');
function meterAngle(c){const cl=Math.max(-50,Math.min(50,c));return cl/50*52;}
function mpolar(r,deg){const rad=(deg-90)*Math.PI/180;return [150+r*Math.cos(rad),90+r*Math.sin(rad)];}
function buildLCD(){
  lcd.innerHTML='';
  const d=el('defs',{});d.innerHTML=`<radialGradient id="vig" cx=".5" cy=".4" r=".7"><stop offset=".7" stop-color="rgba(0,0,0,0)"/><stop offset="1" stop-color="rgba(0,0,0,.25)"/></radialGradient>`;lcd.appendChild(d);
  lcd.appendChild(el('rect',{x:8,y:6,width:284,height:170,rx:22,fill:'#141414',stroke:'#000','stroke-width':2}));
  lcd.appendChild(el('rect',{x:8,y:6,width:284,height:60,rx:22,fill:'rgba(255,255,255,.05)'}));
  lcd.appendChild(el('rect',{x:135,y:170,width:30,height:24,rx:6,fill:'#1c1c1c'}));
  lcd.appendChild(el('rect',{id:'lcdPanel',x:24,y:20,width:252,height:142,rx:12,fill:'var(--lcd-blue)'}));
  lcd.appendChild(el('rect',{x:24,y:20,width:252,height:142,rx:12,fill:'url(#vig)'}));
  [['-50',56],['-20',104],['0',150],['+20',196],['+50',244]].forEach(([t,x])=>{const e=el('text',{x,y:40,"text-anchor":"middle","font-size":9,'font-weight':700,fill:'var(--lcd-blue-dim)',class:'lcdDim'});e.textContent=t;lcd.appendChild(e);});
  const ticks=el('g',{});for(let c=-50;c<=50;c+=10){const a=meterAngle(c),[ox,oy]=mpolar(56,a),[ix,iy]=mpolar(48,a);ticks.appendChild(el('line',{x1:ox,y1:oy,x2:ix,y2:iy,stroke:c===0?'var(--lcd-blue-fg)':'var(--lcd-blue-dim)','stroke-width':c===0?2.5:1.5,class:c===0?'lcdFg':'lcdDim'}));}lcd.appendChild(ticks);
  lcd.appendChild(el('line',{id:'lcdNeedle',x1:150,y1:90,x2:150,y2:42,stroke:'var(--lcd-blue-fg)','stroke-width':3,'stroke-linecap':'round'}));
  lcd.appendChild(el('circle',{cx:150,cy:90,r:4,fill:'var(--lcd-blue-fg)',class:'lcdFg'}));
  const al=el('text',{id:'arrL',x:62,y:100,"font-size":18,'font-weight':900,fill:'var(--lcd-blue-dim)'});al.textContent='◀';lcd.appendChild(al);
  const ar=el('text',{id:'arrR',x:238,y:100,"text-anchor":"end","font-size":18,'font-weight':900,fill:'var(--lcd-blue-dim)'});ar.textContent='▶';lcd.appendChild(ar);
  const note=el('text',{id:'lcdNote',x:138,y:124,"text-anchor":"middle","font-size":54,'font-weight':800,fill:'var(--lcd-blue-fg)'});note.textContent='G';lcd.appendChild(note);
  const sub=el('text',{id:'lcdSub',x:196,y:96,"font-size":20,'font-weight':800,fill:'var(--lcd-blue-fg)'});sub.textContent='④';lcd.appendChild(sub);
  const md=el('text',{id:'lcdMode',x:150,y:152,"text-anchor":"middle","font-size":11,'font-weight':700,fill:'var(--lcd-blue-dim)','letter-spacing':2});md.textContent='U · UKULELE';lcd.appendChild(md);
}
const MODE_FULL={C:'CHROMATIC',G:'GUITAR',B:'BASS',V:'VIOLIN',U:'UKULELE'};
function renderLCD(noteName,sub,cents,ok){
  const ang=meterAngle(cents),[nx,ny]=mpolar(48,ang);
  const ndl=document.getElementById('lcdNeedle');ndl.setAttribute('x2',nx);ndl.setAttribute('y2',ny);
  const fg=ok?'var(--lcd-grn-fg)':'var(--lcd-blue-fg)',dim=ok?'var(--lcd-grn-dim)':'var(--lcd-blue-dim)';
  document.getElementById('lcdPanel').setAttribute('fill',ok?'var(--lcd-grn)':'var(--lcd-blue)');
  ndl.setAttribute('stroke',ok?'var(--lcd-grn-fg)':'var(--bad)');
  document.querySelectorAll('.lcdFg').forEach(e=>e.setAttribute(e.tagName==='line'?'stroke':'fill',fg));
  document.querySelectorAll('.lcdDim').forEach(e=>e.setAttribute(e.tagName==='line'?'stroke':'fill',dim));
  document.getElementById('lcdNote').setAttribute('fill',fg);
  document.getElementById('lcdSub').setAttribute('fill',fg);
  document.getElementById('lcdMode').setAttribute('fill',dim);
  document.getElementById('arrL').setAttribute('fill',(!ok&&cents<0)?'var(--bad)':dim);
  document.getElementById('arrR').setAttribute('fill',(!ok&&cents>0)?'var(--bad)':dim);
  document.getElementById('lcdNote').textContent=noteName;
  document.getElementById('lcdSub').textContent=sub;
  document.getElementById('lcdMode').textContent=`${mode} · ${MODE_FULL[mode]}`;
}

/* ===== 현악기 헤드 ===== */
const instr=document.getElementById('instr');
function buildInstrument(){
  const L=LAYOUT[mode]; instr.innerHTML='';
  const defs=el('defs',{});defs.innerHTML=WOOD;instr.appendChild(defs);
  // 바이올린 스크롤
  if(L.scroll){
    instr.appendChild(el('path',{d:'M180 214 C150 214 132 196 132 168 C132 140 152 120 180 120 C205 120 222 138 222 162 C222 182 208 196 190 196 C176 196 166 186 166 174 C166 164 174 156 184 156 C191 156 196 161 196 167',fill:'none',stroke:'#7c4a22','stroke-width':10,'stroke-linecap':'round'}));
    instr.appendChild(el('circle',{cx:184,cy:168,r:7,fill:'#5e3717'}));
  }
  // 헤드스톡
  instr.appendChild(el('path',{d:L.head,fill:'url(#wood)',stroke:'var(--wood-edge)','stroke-width':3}));
  const grain=el('g',{stroke:'rgba(60,30,10,.18)','stroke-width':1.3,fill:'none'});
  L.grain.forEach((x,i)=>grain.appendChild(el('path',{d:`M${x} ${L.grainY[0]} Q${x+(i%2?7:-7)} ${L.grainY[1]} ${x+(i%2?-4:5)} ${L.grainY[2]}`})));
  instr.appendChild(grain);
  // 너트 + 지판
  instr.appendChild(el('rect',{x:L.nut[0],y:L.nut[1]-13,width:L.nut[2],height:13,rx:4,fill:'#eadfc8',stroke:'var(--wood-edge)','stroke-width':2}));
  instr.appendChild(el('rect',{x:L.fbX[0],y:L.nutY+11,width:L.fbX[1]-L.fbX[0],height:L.bottom-(L.nutY+11),fill:'#3a2414'}));
  instr.appendChild(el('rect',{x:L.fbX[0],y:L.nutY+11,width:L.fbX[1]-L.fbX[0],height:L.bottom-(L.nutY+11),fill:'url(#fb)'}));
  instr.appendChild(el('g',{id:'dyn'}));
  buildStrings();
}
function buildStrings(){
  const L=LAYOUT[mode],dyn=document.getElementById('dyn');dyn.innerHTML='';
  const n=L.strings.length;
  L.strings.forEach((s,i)=>{
    const post=s.post,knob=s.knob,nx=s.nutX;
    const isLow=(mode==='U'&&s.id===4&&gMode==='low');
    const w=(1.3+(n-i)*0.45)+(isLow?1.2:0);
    dyn.appendChild(el('path',{id:'line-'+s.id,d:`M${post[0]} ${post[1]} L${nx} ${L.nutY} L${nx} ${L.bottom}`,fill:'none',stroke:isLow?'#cdbf9e':'var(--string)','stroke-width':w.toFixed(1),'stroke-linejoin':'round'}));
    const hit=el('path',{d:`M${nx} ${L.nutY} L${nx} ${L.bottom}`,stroke:'transparent','stroke-width':22,fill:'none'});hit.style.cursor='pointer';hit.addEventListener('click',()=>{select(s.id);pluck(s.id);});dyn.appendChild(hit);
    const ln=el('text',{x:nx,y:L.bottom-9,"text-anchor":"middle","font-size":12,'font-weight':800,fill:'#fff'});ln.textContent=s.note;dyn.appendChild(ln);
    const nn=el('text',{x:nx,y:L.bottom+9,"text-anchor":"middle","font-size":9.5,fill:'rgba(255,255,255,.8)'});nn.textContent=s.id+'번';dyn.appendChild(nn);
    dyn.appendChild(el('circle',{cx:post[0],cy:post[1],r:7,fill:'#d9d4cc',stroke:'#9a948a','stroke-width':2}));
    dyn.appendChild(el('circle',{cx:post[0],cy:post[1],r:3,fill:'#7a756c'}));
    dyn.appendChild(el('line',{x1:post[0],y1:post[1],x2:knob[0],y2:knob[1],stroke:'#3a3027','stroke-width':5,'stroke-linecap':'round'}));
    const g=el('g',{class:'knob-grp',id:'peg-'+s.id});g.style.transformBox='fill-box';g.style.transformOrigin='center';
    const big=!!L.bassKnob, rx=big?20:16, ry=big?14:11, gh=big?11:8;
    g.appendChild(el('ellipse',{cx:knob[0],cy:knob[1],rx,ry,fill:'url(#knobg)',stroke:'#3a210e','stroke-width':2}));
    for(let k=-2;k<=2;k++)g.appendChild(el('line',{x1:knob[0]+k*4.5,y1:knob[1]-gh,x2:knob[0]+k*4.5,y2:knob[1]+gh,stroke:'rgba(40,20,5,.4)','stroke-width':1.5}));
    g.appendChild(el('ellipse',{cx:knob[0]-4,cy:knob[1]-4,rx:5,ry:3,fill:'rgba(255,255,255,.18)'}));
    attachDrag(g,s.id);dyn.appendChild(g);
  });
}

/* ===== 피아노 (크로마틱) ===== */
const piano=document.getElementById('piano');
const WHITE_PC=[0,2,4,5,7,9,11], WIDX={0:0,2:1,4:2,5:3,7:4,9:5,11:6};
const WHITE_SEQ=[0,2,4,5,7,9,11,0]; // 도레미파솔라시도 — 마지막은 옥타브 위 C
// pc -> [경계 인덱스(왼쪽 흰건반 수), 실제 피아노 비대칭 오프셋]
const BLACK={1:[1,-0.06],3:[2,0.06],6:[4,-0.07],8:[5,0],10:[6,0.07]};
const WN=34,X0=30,KY=70,KH=150,BW=WN*0.62;
function blackCenter(pc){const b=BLACK[pc];return X0+b[0]*WN+b[1]*WN;}
function buildPiano(){
  piano.innerHTML='';
  WHITE_SEQ.forEach((pc,i)=>{
    const last=(i===WHITE_SEQ.length-1), id=last?'wk-0b':'wk-'+pc;
    const k=el('rect',{id,x:X0+i*WN,y:KY,width:WN-2,height:KH,rx:4,fill:'#fff',stroke:'#bbb','stroke-width':1.4});
    k.style.cursor='pointer';k.addEventListener('click',()=>gotoPC(pc,last));piano.appendChild(k);
    const nm=el('text',{x:X0+i*WN+WN/2-1,y:KY+KH-8,"text-anchor":"middle","font-size":11,fill:'#9a8','pointer-events':'none'});nm.textContent=NOTE_NAMES[pc];piano.appendChild(nm);
  });
  Object.keys(BLACK).forEach(pc=>{
    const k=el('rect',{id:'wk-'+pc,x:blackCenter(pc)-BW/2,y:KY,width:BW,height:KH*0.62,rx:3,fill:'#222',stroke:'#000','stroke-width':1});
    k.style.cursor='pointer';k.addEventListener('click',()=>gotoPC(+pc));piano.appendChild(k);
  });
  const g=el('g',{id:'pPtr'});
  g.appendChild(el('rect',{id:'pBub',x:-26,y:8,width:52,height:34,rx:9,fill:'#1f4296',stroke:'#16306e','stroke-width':2}));
  const pn=el('text',{id:'pNote',x:0,y:32,"text-anchor":"middle","font-size":20,'font-weight':800,fill:'#fff'});pn.textContent='A';g.appendChild(pn);
  g.appendChild(el('path',{id:'pTri',d:'M-9 42 L9 42 L0 58 Z',fill:'#1f4296'}));
  g.appendChild(el('line',{id:'pStem',x1:0,y1:58,x2:0,y2:68,stroke:'#1f4296','stroke-width':3,'stroke-dasharray':'3 3'}));
  piano.appendChild(g);
}
function keyCenterX(pc){
  if(WIDX[pc]!==undefined) return X0+WIDX[pc]*WN+(WN-2)/2;
  return blackCenter(pc);
}
function renderPiano(){
  const fn=freqToNote(chrom.freq),ok=Math.abs(fn.cents)<=OK;
  // 모든 건반 원색
  WHITE_PC.forEach(pc=>{const k=document.getElementById('wk-'+pc);if(k)k.setAttribute('fill','#fff');});
  const lastC=document.getElementById('wk-0b');if(lastC)lastC.setAttribute('fill','#fff');
  Object.keys(BLACK).forEach(pc=>{const k=document.getElementById('wk-'+pc);if(k)k.setAttribute('fill','#222');});
  // 현재 건반 강조 (옥타브 위 C이면 오른쪽 끝 C 건반)
  const isHiC=(fn.pc===0 && fn.oct===chrom.oct+1);
  const cur=document.getElementById(isHiC?'wk-0b':'wk-'+fn.pc);
  const hi=ok?'#2fa66a':'#3a7bd5';
  if(cur)cur.setAttribute('fill',hi);
  // 포인터 이동/색
  const x=isHiC ? (X0+(WHITE_SEQ.length-1)*WN+(WN-2)/2) : keyCenterX(fn.pc);
  document.getElementById('pPtr').setAttribute('transform',`translate(${x},0)`);
  ['pBub','pTri','pStem'].forEach(id=>{const e=document.getElementById(id);e.setAttribute(e.tagName==='line'?'stroke':'fill', ok?'#2fa66a':'#1f4296');});
  document.getElementById('pStem').setAttribute('stroke',ok?'#2fa66a':'#1f4296');
  document.getElementById('pNote').textContent=fn.name;
  renderLCD(fn.name,'',fn.cents,ok);
}
function gotoPC(pc,hi){
  const oct=chrom.oct+(hi?1:0);
  const midi=(oct+1)*12+pc;            // C4=60, C5=72
  chrom.freq=440*Math.pow(2,(midi-69)/12);
  render(); pluckKey(chrom.freq);
}

/* ===== render ===== */
function render(){
  if(mode==='C'){ renderPiano(); updTurn(null); return; }
  const s=curStrings().find(x=>x.id===selected);
  const c=state[selected].cents, ok=Math.abs(c)<=OK;
  renderLCD(s.note,circled[s.id],c,ok);
  updTurn(s);
  curStrings().forEach(x=>{const ln=document.getElementById('line-'+x.id);if(ln)ln.setAttribute('stroke',x.id===selected?'#f4c542':((mode==='U'&&x.id===4&&gMode==='low')?'#cdbf9e':'var(--string)'));});
  document.querySelectorAll('.chip').forEach(ch=>{const id=+ch.dataset.id,cc=state[id].cents,dn=Math.abs(cc)<=OK;ch.classList.toggle('sel',id===selected);ch.classList.toggle('done',dn);ch.querySelector('.cstate').textContent=dn?'맞음':(cc<0?`낮음 ${cc.toFixed(0)}`:`높음 +${cc.toFixed(0)}`);});
}
function updTurn(s){const up=document.getElementById('upTurn'),dn=document.getElementById('downTurn');if(s){up.textContent=s.upCW?'↻ 시계방향':'↺ 반시계방향';dn.textContent=s.upCW?'↺ 반시계방향':'↻ 시계방향';}else{up.textContent='';dn.textContent='';}}

/* ===== 조작 ===== */
function select(id){selected=id;render();}
function setCents(id,v){state[id].cents=Math.max(-60,Math.min(60,v));}
function rotateKnobTo(id){if(mode==='C')return;const s=curStrings().find(x=>x.id===id);if(!s)return;const dirUp=s.upCW?1:-1;state[id].pegAngle=-state[id].cents*dirUp*1.6;const peg=document.getElementById('peg-'+id);if(peg)peg.style.transform=`rotate(${state[id].pegAngle}deg)`;}
function tune(up){
  if(mode==='C'){chrom.freq*=Math.pow(2,(up?STEP:-STEP)/1200);render();pluckKey(chrom.freq,0.7);return;}
  const id=selected;setCents(id,state[id].cents+(up?STEP:-STEP));rotateKnobTo(id);render();wobble(id);pluck(id,0.32);
}
let drag=null;
function attachDrag(g,id){g.addEventListener('pointerdown',e=>{e.preventDefault();select(id);drag={id,startY:e.clientY,startCents:state[id].cents};g.setPointerCapture(e.pointerId);});}
window.addEventListener('pointermove',e=>{if(!drag)return;const dy=drag.startY-e.clientY;setCents(drag.id,drag.startCents+dy*0.45);rotateKnobTo(drag.id);render();});
window.addEventListener('pointerup',()=>{if(!drag)return;const id=drag.id;drag=null;wobble(id);pluck(id,0.3);});
function wobble(id){
  if(mode==='C')return;const L=LAYOUT[mode],s=curStrings().find(x=>x.id===id);if(!s)return;
  const ln=document.getElementById('line-'+id);if(!ln)return;const post=s.post,nx=s.nutX;
  const baseD=`M${post[0]} ${post[1]} L${nx} ${L.nutY} L${nx} ${L.bottom}`;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ln.setAttribute('d',baseD);return;}
  let t=0;const mid=(L.nutY+L.bottom)/2;
  const iv=setInterval(()=>{t++;const amp=5*Math.exp(-t/6)*Math.sin(t*1.7);ln.setAttribute('d',`M${post[0]} ${post[1]} L${nx} ${L.nutY} Q${nx+amp} ${mid} ${nx} ${L.bottom}`);if(t>=14){clearInterval(iv);ln.setAttribute('d',baseD);}},28);
}

/* ===== 소리 ===== */
let actx=null;
function ensureAudio(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}
function pluckFreq(freq,gain=0.9){ensureAudio();const sr=actx.sampleRate,N=Math.max(2,Math.round(sr/freq)),len=Math.floor(sr*2),buf=actx.createBuffer(1,len,sr),d=buf.getChannelData(0);for(let i=0;i<N;i++)d[i]=Math.random()*2-1;const decay=freq<240?0.9985:0.9965;for(let i=N;i<len;i++)d[i]=0.5*(d[i-N]+d[i-N+1])*decay;for(let i=0;i<len;i++)d[i]*=Math.min(1,(len-i)/(sr*0.3));const src=actx.createBufferSource();src.buffer=buf;const g=actx.createGain();g.gain.value=gain;const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3800;src.connect(lp).connect(g).connect(actx.destination);src.start();}
function pluck(id,gain=0.9){pluckFreq(curFreq(id),gain);}
function pluckKey(freq,gain=0.8){
  ensureAudio();const t=actx.currentTime;
  const g=actx.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(gain,t+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,t+1.7);
  g.connect(actx.destination);
  [[1,1],[2,0.45],[3,0.22],[4,0.1]].forEach(([m,a])=>{
    const o=actx.createOscillator();o.type='triangle';o.frequency.value=freq*m;
    const og=actx.createGain();og.gain.value=a;
    o.connect(og).connect(g);o.start(t);o.stop(t+1.7);
  });
}

/* ===== 칩 ===== */
function buildChips(){
  const w=document.getElementById('chips');w.innerHTML='';
  if(mode==='C'){document.getElementById('chipsTitle').textContent='반음계 — 자유 음정';return;}
  document.getElementById('chipsTitle').textContent='줄 선택 · 조율 상태';
  curStrings().forEach(s=>{const c=document.createElement('div');c.className='chip';c.dataset.id=s.id;c.innerHTML=`<div class="cn">${s.id}번</div><div class="cnote">${s.note}</div><div class="cstate"></div>`;c.addEventListener('click',()=>{select(s.id);pluck(s.id);});w.appendChild(c);});
}

/* ===== 모드 전환 ===== */
function applyModeUI(){
  document.getElementById('gmodeWrap').style.display=mode==='U'?'block':'none';
  document.getElementById('instr').style.display=mode==='C'?'none':'block';
  document.getElementById('piano').style.display=mode==='C'?'block':'none';
  document.getElementById('chromBox').style.display=mode==='C'?'block':'none';
  const tt=document.getElementById('headTitle');
  if(mode==='U')tt.textContent='우쿨렐레 헤드 · 줄을 누르면 소리, 줄감개를 끌면 조율';
  else if(mode==='C')tt.textContent='반음계 튜너 · 가까운 음을 피아노에서 가리킵니다';
  else tt.textContent=`${LAYOUT[mode].name} 헤드 · 줄감개를 끌거나 ▲▼로 조율`;
  document.getElementById('chromBox').innerHTML='<b>반음계 모드</b> — 목표 줄 없이 어떤 음이든 가장 가까운 음을 표시합니다. ▲▼로 음을 만들어 보세요.';
  document.getElementById('hint').innerHTML = mode==='C'
    ? '연주음과 가장 가까운 음이름·옥타브, ±cents 오차를 보여줍니다. 화살표가 피아노 건반을 가리켜요.'
    : '줄감개 노브를 <b>위로 끌면 음↑</b>, 아래로 끌면 음↓. 회전 방향은 악기마다 반대일 수 있어요. 핵심은 “조이면↑·풀면↓”.';
}
function switchMode(m){
  mode=m;
  document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  applyModeUI();
  if(m==='C'){chrom.freq=F.A4*Math.pow(2,(Math.random()*84-42)/1200);buildPiano();}
  else{initState();buildInstrument();curStrings().forEach(s=>rotateKnobTo(s.id));}
  buildChips();render();
}

/* ===== 이벤트 ===== */
document.getElementById('modes').addEventListener('click',e=>{const b=e.target.closest('button');if(b)switchMode(b.dataset.m);});
document.getElementById('gmode').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;gMode=b.dataset.g;document.querySelectorAll('#gmode button').forEach(x=>x.classList.toggle('on',x===b));buildStrings();curStrings().forEach(s=>rotateKnobTo(s.id));render();if(selected===4)pluck(4,0.4);});
document.getElementById('pluckBtn').addEventListener('click',()=>{mode==='C'?pluckKey(chrom.freq):pluck(selected);});
document.getElementById('upBtn').addEventListener('click',()=>tune(true));
document.getElementById('downBtn').addEventListener('click',()=>tune(false));
document.getElementById('shuffleBtn').addEventListener('click',()=>{if(mode==='C'){chrom.freq=F.A4*Math.pow(2,(Math.random()*84-42)/1200);}else{initState();curStrings().forEach(s=>rotateKnobTo(s.id));}render();});
document.getElementById('perfectBtn').addEventListener('click',()=>{if(mode==='C'){const fn=freqToNote(chrom.freq);chrom.freq*=Math.pow(2,-fn.cents/1200);render();pluckKey(chrom.freq,0.7);return;}curStrings().forEach(s=>state[s.id].cents=0);curStrings().forEach(s=>rotateKnobTo(s.id));render();pluck(selected,0.5);});
document.addEventListener('keydown',e=>{const ss=curStrings(),idx=ss.findIndex(x=>x.id===selected);if(e.key==='ArrowUp'){tune(true);e.preventDefault();}else if(e.key==='ArrowDown'){tune(false);e.preventDefault();}else if(mode!=='C'&&e.key==='ArrowRight'){select(ss[(idx+1)%ss.length].id);e.preventDefault();}else if(mode!=='C'&&e.key==='ArrowLeft'){select(ss[(idx-1+ss.length)%ss.length].id);e.preventDefault();}else if(e.key===' '||e.key==='Enter'){mode==='C'?pluckKey(chrom.freq):pluck(selected);e.preventDefault();}});

/* ===== 시작 ===== */
buildLCD();initState();buildInstrument();curStrings().forEach(s=>rotateKnobTo(s.id));buildChips();applyModeUI();render();
</script>
